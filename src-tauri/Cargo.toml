[package]
name = "evolve-ap-ocr"
version = "1.0.0"
description = "Evolve AP Invoice OCR"
authors = ["Evolve"]
edition = "2021"

[lib]
name = "evolve_ap_ocr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
