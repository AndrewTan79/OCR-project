name: Build desktop apps

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build app (exe + installer)
        run: npx tauri build

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/evolve-ap-ocr.exe "out/Evolve-AP-Invoice-OCR.exe"
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            Copy-Item $_.FullName "out/Evolve-AP-Invoice-OCR-Setup.exe"
          }
          Get-ChildItem out | Format-Table Name, Length

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: Evolve-AP-Invoice-OCR-portable
          path: out/Evolve-AP-Invoice-OCR.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Evolve-AP-Invoice-OCR-installer
          path: out/Evolve-AP-Invoice-OCR-Setup.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Evolve-AP-Invoice-OCR.exe
            out/Evolve-AP-Invoice-OCR-Setup.exe

  macos:
    name: macOS (.dmg, Apple Silicon + Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build app (universal)
        run: npx tauri build --target universal-apple-darwin --bundles app

      - name: Create disk image
        run: |
          APP_DIR=src-tauri/target/universal-apple-darwin/release/bundle/macos
          APP="$APP_DIR/Evolve AP Invoice OCR.app"
          test -d "$APP"
          lipo -info "$APP/Contents/MacOS/"*
          codesign --verify --verbose "$APP" || true
          mkdir -p dmg-root out
          cp -R "$APP" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Evolve AP Invoice OCR" -srcfolder dmg-root -ov -format UDZO \
            out/Evolve-AP-Invoice-OCR-mac.dmg
          ls -la out

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: Evolve-AP-Invoice-OCR-mac
          path: out/Evolve-AP-Invoice-OCR-mac.dmg
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/Evolve-AP-Invoice-OCR-mac.dmg
