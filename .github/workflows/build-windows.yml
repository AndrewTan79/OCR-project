name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build app (exe + installer)
        run: npx tauri build

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/evolve-ap-ocr.exe "out/Evolve-AP-Invoice-OCR.exe"
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            Copy-Item $_.FullName "out/Evolve-AP-Invoice-OCR-Setup.exe"
          }
          Get-ChildItem out | Format-Table Name, Length

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: Evolve-AP-Invoice-OCR-portable
          path: out/Evolve-AP-Invoice-OCR.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Evolve-AP-Invoice-OCR-installer
          path: out/Evolve-AP-Invoice-OCR-Setup.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Evolve-AP-Invoice-OCR.exe
            out/Evolve-AP-Invoice-OCR-Setup.exe
